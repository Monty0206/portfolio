<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Montell Boks</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .contact-form {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .social-links a {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s;
            position: relative;
        }

        .social-links a::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .social-links a:hover {
            transform: translateY(-5px) rotate(10deg);
            border-color: var(--primary);
        }

        .social-links a:hover::before {
            opacity: 1;
        }

        .social-links a span {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div id="particles"></div>

    <!-- Navigation -->
    <nav id="navbar">
        <div class="container">
            <div class="logo">MTB</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="certifications.html">Certifications</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact Section -->
    <section style="padding-top: 120px;">
        <h2 class="section-title">Let's Work Together</h2>
        <p class="section-subtitle">I'm always open to discussing new projects and opportunities</p>
        <div class="contact-content">
            <form class="contact-form" id="contactForm" action="https://formspree.io/f/mjkaeoqw" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="Project Inquiry">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Tell me about your project..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
            </form>
            <div class="social-links">
                <a href="https://github.com/Monty0206" target="_blank" title="GitHub"><span>💻</span></a>
                <a href="https://linkedin.com/in/montell-boks-37b9a219b" target="_blank" title="LinkedIn"><span>💼</span></a>
                <a href="https://twitter.com/montellboks" target="_blank" title="Twitter"><span>🐦</span></a>
                <a href="mailto:montellboks@gmail.com" title="Email"><span>✉️</span></a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Montell Tyrique Boks. Built with passion and lots of coffee ☕</p>
        <p>Designed & Developed in Cape Town, South Africa 🇿🇦</p>
    </footer>

    <!-- Back to Top Button -->
    <a href="#" class="back-to-top" id="backToTop">↑</a>

    <script src="script.js"></script>
    <script>
        // Contact Form Submission
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const submitButton = form.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            
            // Show loading state
            submitButton.textContent = 'Sending...';
            submitButton.disabled = true;
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    alert('✅ Thank you! Your message has been sent successfully. I will get back to you soon!');
                    form.reset();
                } else {
                    alert('❌ Oops! There was a problem. Please email me directly at montellboks@gmail.com');
                }
            } catch (error) {
                alert('❌ Oops! There was a problem. Please email me directly at montellboks@gmail.com');
            } finally {
                submitButton.textContent = originalText;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
